<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ibrahim Cloth Center</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f7f7f7;
color:#171717;
}

header{
background:#111;
color:#fff;
position:sticky;
top:0;
z-index:100;
box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.topbar{
max-width:1250px;
margin:auto;
padding:17px 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:23px;
font-weight:800;
letter-spacing:2px;
white-space:nowrap;
}

.logo span{
display:block;
font-size:10px;
letter-spacing:4px;
color:#bbb;
margin-top:3px;
}

.menu-btn{
background:none;
color:white;
border:0;
font-size:27px;
cursor:pointer;
}

.search-area{
background:#fff;
padding:14px 20px;
border-bottom:1px solid #eee;
}

.search{
max-width:800px;
margin:auto;
display:flex;
background:#f3f3f3;
border-radius:30px;
overflow:hidden;
}

.search input{
flex:1;
border:0;
outline:0;
padding:14px 18px;
background:transparent;
font-size:15px;
}

.search button{
border:0;
background:#111;
color:#fff;
padding:0 22px;
cursor:pointer;
}

.side-menu{
position:fixed;
top:0;
left:-310px;
width:290px;
height:100%;
background:#fff;
z-index:200;
box-shadow:4px 0 20px rgba(0,0,0,.2);
transition:.3s;
padding:25px;
}

.side-menu.open{left:0}

.side-menu h2{margin-bottom:25px}

.side-menu button{
width:100%;
text-align:left;
padding:14px;
border:0;
background:#fff;
border-bottom:1px solid #eee;
cursor:pointer;
font-size:15px;
}

.close-menu{
float:right;
font-size:25px!important;
width:auto!important;
}

.hero{
min-height:440px;
background:
linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.48)),
linear-gradient(135deg,#1c1c1c,#7b0000,#161616);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:50px 20px;
}

.hero h1{
font-size:clamp(38px,8vw,80px);
letter-spacing:4px;
}

.hero p{
margin:18px 0 28px;
font-size:18px;
letter-spacing:2px;
}

.shop-btn{
display:inline-block;
background:#fff;
color:#111;
padding:14px 28px;
border-radius:4px;
text-decoration:none;
font-weight:bold;
}

.section{
max-width:1250px;
margin:auto;
padding:55px 20px;
}

.section-title{
text-align:center;
margin-bottom:30px;
}

.section-title h2{font-size:32px}

.section-title p{
color:#777;
margin-top:8px;
}

.categories{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:9px;
margin-bottom:35px;
}

.categories button{
border:1px solid #222;
background:white;
padding:10px 18px;
border-radius:30px;
cursor:pointer;
}

.categories button.active,
.categories button:hover{
background:#111;
color:#fff;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:23px;
}

.product{
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.media{
position:relative;
background:#eee;
}

.main-image{
width:100%;
height:300px;
object-fit:cover;
display:block;
}

.video{
width:100%;
max-height:350px;
display:block;
background:#000;
}

.badge{
position:absolute;
top:12px;
left:12px;
background:#111;
color:#fff;
padding:6px 10px;
font-size:11px;
border-radius:3px;
}

.info{padding:17px}

.info h3{
font-size:18px;
margin-bottom:7px;
}

.category-name{
color:#888;
font-size:13px;
margin-bottom:10px;
}

.price{
font-size:20px;
font-weight:bold;
margin-bottom:12px;
}

.description{
color:#666;
font-size:14px;
line-height:1.5;
margin-bottom:14px;
}

.order-btn{
display:block;
text-align:center;
background:#20c767;
color:#fff;
text-decoration:none;
padding:12px;
border-radius:6px;
font-weight:bold;
}

.photos{
display:flex;
gap:6px;
padding:8px;
overflow-x:auto;
background:#fafafa;
}

.photos img{
width:55px;
height:55px;
object-fit:cover;
border-radius:5px;
cursor:pointer;
}

.empty{
text-align:center;
grid-column:1/-1;
padding:50px;
color:#777;
}

footer{
background:#111;
color:#fff;
text-align:center;
padding:45px 20px;
}

.footer-links{
margin-top:20px;
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
}

.footer-links a{
color:#fff;
text-decoration:none;
border:1px solid #555;
padding:11px 18px;
border-radius:5px;
}

.whatsapp{
position:fixed;
right:18px;
bottom:18px;
width:60px;
height:60px;
border-radius:50%;
background:#20c767;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
font-size:27px;
z-index:150;
}

.owner-page{
display:none;
max-width:700px;
margin:40px auto;
padding:20px;
}

.owner-box{
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 4px 20px rgba(0,0,0,.1);
}
